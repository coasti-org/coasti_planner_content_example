# Runtime configuration for the Coasti Planner backend in development mode.
#
# Keep this file in the extension root and pass its path to the backend:
#
#     coasti-planner config.dev.example.yml
#
# Relative paths resolve against this file, so `data/...` and `extensions[].path`
# are read relative to the folder holding the config.
host: 0.0.0.0
port: 8000
# Reload the extension's pydantic models on change.
mode: dev
log_level: debug

# Framework meta database (users, permissions, application metadata).
database: sqlite:///./data/coasti_planner.sqlite

extensions:
  # The folder holding this extension's coasti.yml; "." is this repository.
  - path: "./"
    # Serve the extension frontend from its Vite dev server instead of ./dist.
    dev_url: "http://localhost:5174"
    # Content database for the example table.
    database: sqlite:///./data/dummy.sqlite

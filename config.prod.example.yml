# Runtime configuration for the Coasti Planner backend in production mode.
#
# Keep this file in the extension root and pass its path to the backend:
#
#     coasti-planner config.prod.example.yml
#
# Relative paths resolve against this file, so `data/...` and `extensions[].path`
# are read relative to the folder holding the config.
host: 0.0.0.0
port: 8000
mode: prod
log_level: info

# Framework meta database (users, permissions, application metadata).
database: sqlite:///./data/coasti_planner.sqlite

extensions:
  # The folder holding this extension's coasti.yml; "." is this repository.
  - path: "./"
    # Content database for the example table.
    database: sqlite:///./data/dummy.sqlite

# Excel import and export (needs coasti-planner[excel]). All keys are optional;
# the values below are the defaults. Pending imports are kept in memory, so the
# backend must run as a single process.
# excel:
#   session_ttl_minutes: 30        # a checked file waits this long for confirmation
#   max_open_sessions_per_user: 3  # a new upload discards the oldest
#   max_file_size_mb: 20
#   max_rows: 200000
#   audit_table: xls_io_audit      # in the content database; null turns it off

services:
  backend:
    image: coasti-planner-content-example:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    entrypoint: ["coasti-planner", "config.dev.example.yml"]
    ports:
      - "8000:8000"
    volumes:
      - ..:/app

  extension:
    image: coasti-planner-content-example:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    entrypoint: ["/entrypoint.dev.sh"]
    secrets:
      - registry_ro_token
    ports:
      - "5174:5174"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm_store

secrets:
  registry_ro_token:
    environment: REGISTRY_RO_TOKEN

volumes:
  node_modules:
  pnpm_store:
